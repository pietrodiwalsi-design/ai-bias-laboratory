[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bias-laboratory"
version = "1.0.0"
description = "Enterprise AI Fairness, Bias Detection & Model Governance FastMCP Server"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "fairlearn>=0.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.scripts]
ai-bias-lab = "ai_bias_lab.cli:main"
ai-bias-mcp = "ai_bias_lab.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
